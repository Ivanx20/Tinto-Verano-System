server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: permite resolver el servicio "api" en caliente.
    # Al usar una variable, Nginx arranca aunque la API todavia no exista.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $tinto_api http://api:4100;

    # Todo lo que empiece por /api viaja al backend Express. Asi el navegador
    # ve un unico origen y no hacen falta reglas CORS entre contenedores.
    location /api/ {
        # Con una variable en proxy_pass, Nginx NO reescribe el prefijo de la
        # location: hay que reenviar la URI original con $request_uri.
        proxy_pass $tinto_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router resuelve las rutas en el cliente: cualquier ruta
    # desconocida debe devolver index.html y no un 404 de Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
